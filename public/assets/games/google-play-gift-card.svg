<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#06070b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="card-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.02)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="neon-orb" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#bg-grad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="400" r="320" fill="url(#neon-orb)" />
  <circle cx="700" cy="150" r="180" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle cx="100" cy="850" r="160" fill="#f59e0b" opacity="0.15" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="200" y1="0" x2="200" y2="1000" />
    <line x1="400" y1="0" x2="400" y2="1000" />
    <line x1="600" y1="0" x2="600" y2="1000" />
  </g>

  <!-- Main Card Hologram Outline -->
  <rect x="70" y="100" width="660" height="800" rx="40" fill="#0d111f" fill-opacity="0.75" stroke="url(#accent-grad)" stroke-width="3" filter="url(#glow)" />
  <rect x="70" y="100" width="660" height="800" rx="40" fill="url(#card-sheen)" />

  <!-- Top Brand Strip -->
  <g transform="translate(110, 150)">
    <!-- IONARA Mini Logo -->
    <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ec4899" letter-spacing="4">IONARA</text>
    <text x="120" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#a1a1aa" letter-spacing="2">OFFICIAL STORE</text>
    
    <!-- Authentic Badge -->
    <rect x="420" y="4" width="160" height="30" rx="15" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1.5" />
    <text x="500" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">100% GARANTI</text>
  </g>

  <!-- Central Platform Card Presentation -->
  <g transform="translate(130, 240)">
    <!-- Holographic Card Visual -->
    <rect x="0" y="0" width="540" height="320" rx="28" fill="url(#accent-grad)" opacity="0.9" filter="url(#glow)" />
    
    <!-- Chip Icon -->
    <rect x="50" y="40" width="64" height="48" rx="10" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <line x1="50" y1="64" x2="114" y2="64" stroke="#b45309" stroke-width="1.5" />
    <line x1="82" y1="40" x2="82" y2="88" stroke="#b45309" stroke-width="1.5" />
    
    <!-- Contactless icon -->
    <path d="M140 50 A 20 20 0 0 1 140 78 M150 42 A 32 32 0 0 1 150 86 M160 34 A 44 44 0 0 1 160 94" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Platform Name Large -->
    <text x="50" y="160" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">GOOGLE PLAY</text>
    <text x="50" y="200" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" opacity="0.9" letter-spacing="6">GIFT CARD • CARTE CADEAU</text>

    <!-- Holographic Number Simulation -->
    <text x="50" y="260" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff" opacity="0.95" letter-spacing="4">••••  ••••  ••••  CODE</text>

    <!-- Region Flags in corner -->
    <text x="490" y="270" font-family="system-ui, sans-serif" font-size="20" text-anchor="end">🇺🇸 🇪🇺 🌍 🇹🇷</text>
  </g>

  <!-- Bottom Details & Denominations Preview -->
  <g transform="translate(110, 610)">
    <text x="0" y="30" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff">Google Play Store Card</text>
    <text x="0" y="65" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#a1a1aa">Montant au choix • Activation immédiate • Sans expiration</text>

    <!-- Preset amounts pills preview -->
    <g transform="translate(0, 95)">
      
        <g transform="translate(0, 0)">
          <rect width="84" height="42" rx="14" fill="#181c2e" stroke="#059669" stroke-width="1.5" stroke-opacity="0.6" />
          <text x="42" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">5$</text>
        </g>
      
        <g transform="translate(95, 0)">
          <rect width="84" height="42" rx="14" fill="#181c2e" stroke="#059669" stroke-width="1.5" stroke-opacity="0.6" />
          <text x="42" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">10$</text>
        </g>
      
        <g transform="translate(190, 0)">
          <rect width="84" height="42" rx="14" fill="#181c2e" stroke="#059669" stroke-width="1.5" stroke-opacity="0.6" />
          <text x="42" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">15$</text>
        </g>
      
        <g transform="translate(285, 0)">
          <rect width="84" height="42" rx="14" fill="#181c2e" stroke="#059669" stroke-width="1.5" stroke-opacity="0.6" />
          <text x="42" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">25$</text>
        </g>
      
        <g transform="translate(380, 0)">
          <rect width="84" height="42" rx="14" fill="#181c2e" stroke="#059669" stroke-width="1.5" stroke-opacity="0.6" />
          <text x="42" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">50$</text>
        </g>
      
        <g transform="translate(475, 0)">
          <rect width="84" height="42" rx="14" fill="#181c2e" stroke="#059669" stroke-width="1.5" stroke-opacity="0.6" />
          <text x="42" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">100$</text>
        </g>
      
    </g>

    <!-- Bottom Features Strip -->
    <g transform="translate(0, 180)">
      <circle cx="12" cy="12" r="8" fill="#10b981" />
      <text x="32" y="17" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e4e4e7">Code digital officiel envoyé instantanément</text>

      <circle cx="12" cy="42" r="8" fill="#06b6d4" />
      <text x="32" y="47" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e4e4e7">Région au choix : USA, Europe, Global, Turquie...</text>

      <circle cx="12" cy="72" r="8" fill="#ec4899" />
      <text x="32" y="77" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e4e4e7">Paiement D17, Flouci, Virement, Izi Zitouna &amp; Wafacash</text>
    </g>
  </g>
</svg>